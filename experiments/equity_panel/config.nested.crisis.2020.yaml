data_path: "data/returns_daily.csv"
start_date: "2018-01-01"
end_date: "2021-12-31"
window_weeks: 104
horizon_weeks: 4
output_dir: "experiments/equity_panel/outputs_nested_crisis_2020"
dealias_delta: 0.0
dealias_delta_frac: 0.015
dealias_eps: 0.02
stability_eta_deg: 0.35
signed_a: true
cs_drop_top_frac: 0.05
a_grid: 180
cs_sensitivity_frac: 0.0
off_component_leak_cap: 15.0
energy_min_abs: 5e-07
partial_week_policy: "drop"
design: "nested"
nested_replicates: 5
oneway_a_solver: "auto"
target_component: 0
edge_mode: "tyler"
use_tvector: false
gating:
  enable: true
  mode: calibrated
  q_max: 2
  require_isolated: false
  allow_nonisolated_nested: true
  nonisolated_stability_min: 0.025
  nonisolated_edge_min: 0.025
  nonisolated_q_max: 2
