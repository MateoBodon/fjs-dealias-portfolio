data_path: "data/returns_daily.csv"
start_date: "2022-01-01"
end_date: "2023-12-31"
window_weeks: 60
horizon_weeks: 1
output_dir: "experiments/equity_panel/outputs_nested_smoke"
dealias_delta: 0.0
dealias_delta_frac: 0.01
dealias_eps: 0.02
stability_eta_deg: 0.25
signed_a: true
cs_drop_top_frac: 0.05
a_grid: 90
cs_sensitivity_frac: 0.0
off_component_leak_cap: 10.0
energy_min_abs: 0.000001
partial_week_policy: "drop"
design: "nested"
nested_replicates: 5
oneway_a_solver: "auto"
target_component: 0
edge_mode: "tyler"
gating:
  enable: true
  q_max: 2
  require_isolated: true
  allow_nonisolated_nested: true
  nonisolated_stability_min: 0.35
  nonisolated_q_max: 1
